services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data"]
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/artifacts/mlflow.db
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
